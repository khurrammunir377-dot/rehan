<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="iShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="iGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="iCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="iGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#iShield)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.5"/>
  
  <!-- Subtle Circuit Traces -->
  <path d="M18 26h14l8 8v22" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.3" fill="none"/>
  <circle cx="18" cy="26" r="3" fill="#38bdf8" fill-opacity="0.7"/>
  <path d="M82 74h-14l-8-8v-22" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.3" fill="none"/>
  <circle cx="82" cy="74" r="3" fill="#fbbf24" fill-opacity="0.7"/>

  <!-- Laptop Display Screen -->
  <rect x="25" y="24" width="50" height="34" rx="5" fill="#090d16" stroke="url(#iCyan)" stroke-width="2"/>
  
  <!-- Laptop Keyboard Base Deck -->
  <path d="M18 63h64l-6 6H24l-6-6z" fill="url(#iGold)"/>
  <rect x="42" y="64.5" width="16" height="2.5" rx="1" fill="#0f172a"/>

  <!-- Stylized Capital 'R' in Screen -->
  <path d="M36 31h13c4.5 0 7.5 2.2 7.5 6s-3 6-7.5 6h-8v11h-5V31zm5 4v4h8c2 0 3.5-.8 3.5-2s-1.5-2-3.5-2h-8z" fill="#ffffff"/>
  <path d="M45 43l10 11h-6L40 43.5z" fill="url(#iGold)"/>

  <!-- Glowing Corner Diamond -->
  <polygon points="76,16 80,23 88,27 80,31 76,38 72,31 64,27 72,23" fill="url(#iGold)" filter="url(#iGlow)"/>
</svg>